name: Android APK

on:
  push:
    branches:
      - arena/58a3cdf9-volt-launcher
  workflow_dispatch:
    inputs:
      abi:
        description: Android architecture to build
        type: choice
        required: true
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      CARGO_BUILD_JOBS: "2"
      HORIZON_TELEMETRY_URL: "off"
      ABI: ${{ inputs.abi || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust and Android target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          case "$ABI" in
            arm64-v8a) target=aarch64-linux-android ;;
            armeabi-v7a) target=armv7-linux-androideabi ;;
            x86_64) target=x86_64-linux-android ;;
            x86) target=i686-linux-android ;;
          esac
          rustup target add "$target"

      - name: Configure Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android sdkmanager is missing under $sdk_root" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Prepare pinned engine tables
        run: python tools/android_prepare.py

      - name: Build and audit public APK
        run: python tools/android_build.py --abi "$ABI" --public --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --gradle "$(command -v gradle)"

      - name: Write checksum
        run: sha256sum ".local/android/apk/$ABI/volt-launcher-public.apk" > ".local/android/apk/$ABI/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: volt-launcher-${{ inputs.abi || 'arm64-v8a' }}-${{ github.sha }}
          path: |
            .local/android/apk/${{ inputs.abi || 'arm64-v8a' }}/volt-launcher-public.apk
            .local/android/apk/${{ inputs.abi || 'arm64-v8a' }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
