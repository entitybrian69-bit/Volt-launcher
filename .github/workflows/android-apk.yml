      - name: Compile native Rust library (${{ matrix.abi }})
        if: ${{ !((matrix.abi == 'arm64-v8a' || matrix.abi == 'armeabi-v7a') && needs.plan.outputs.profile == 'release') }}
        env:
          ABI: ${{ matrix.abi }}
          PROFILE: ${{ needs.plan.outputs.profile }}
        run: |
          python3 - <<'PY'
          from collections import deque
          import os
          import subprocess
          import sys

          cmd = [
              sys.executable, "tools/android_build.py",
              "--abi", os.environ["ABI"],
              "--public",
              "--profile", os.environ["PROFILE"],
              "--rust-only",
              "--sdk", os.environ["ANDROID_HOME"],
              "--java-home", os.environ["JAVA_HOME"],
              "--gradle", os.path.expanduser("~/.cache/gradle-8.14/gradle-8.14/bin/gradle"),
          ]
          tail = deque(maxlen=80)
          err_lines = []
          in_err = 0
          proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)
          for line in proc.stdout:
              sys.stdout.write(line)
              sys.stdout.flush()
              stripped = line.rstrip("\r\n")
              tail.append(stripped)
              if stripped.startswith("error"):
                  in_err = 12
              if in_err > 0 and len(err_lines) < 220:
                  err_lines.append(stripped)
                  in_err -= 1
          rc = proc.wait()
          if rc != 0:
              combined = err_lines + ["--- tail ---"] + list(tail) if err_lines else list(tail)
              escaped = "\n".join(combined).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Rust compile failed (exit {rc})::{escaped}", flush=True)
              raise SystemExit(rc)
          PY

      - name: Package, sign, verify and audit public APK (${{ matrix.abi }})
        env:
          ABI: ${{ matrix.abi }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from collections import deque
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          env = dict(os.environ)
          abi = os.environ["ABI"]
          abi_offset = 1 if abi == "arm64-v8a" else 0
          version_code = 280000 + int(os.environ.get("RUN_NUMBER", "1")) * 2 + abi_offset
          env["VOLT_VERSION_CODE"] = str(version_code)
          env["ORG_GRADLE_PROJECT_versionCode"] = str(version_code)
          gradle_user_dir = Path.home() / ".gradle"
          init_d = gradle_user_dir / "init.d"
          init_d.mkdir(parents=True, exist_ok=True)
          (gradle_user_dir / "gradle.properties").write_text(
              "\n".join([
                  f"versionCode={version_code}",
                  "org.gradle.internal.http.connectionTimeout=120000",
                  "org.gradle.internal.http.socketTimeout=120000",
                  "org.gradle.internal.repository.max.tentatives=6",
                  "org.gradle.internal.repository.initial.backoff=2000",
                  "",
              ]),
              encoding="utf-8",
          )
          (init_d / "maven-mirror.gradle").write_text(
              "\n".join([
                  "beforeSettings { settings ->",
                  "    settings.pluginManagement.repositories {",
                  "        google()",
                  "        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }",
                  "    }",
                  "    settings.dependencyResolutionManagement.repositories {",
                  "        google()",
                  "        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }",
                  "    }",
                  "}",
                  "",
              ]),
              encoding="utf-8",
          )
          print(f"Building Volt Launcher with monotonic versionCode={version_code}", flush=True)

          cmd = [
              sys.executable, "tools/android_build.py",
              "--abi", os.environ["ABI"],
              "--public",
              "--profile", os.environ["PROFILE"],
              "--sdk", os.environ["ANDROID_HOME"],
              "--java-home", os.environ["JAVA_HOME"],
              "--gradle", os.path.expanduser("~/.cache/gradle-8.14/gradle-8.14/bin/gradle"),
          ]
          if os.environ.get("WOVEN_LIB"):
              # Attested no-secrets artifact with the pinned registry mods
              # woven in; packaging must not compile over it.
              cmd += ["--prebuilt-library", os.environ["WOVEN_LIB"]]
          rc = 1
          tail = deque(maxlen=40)
          for attempt in range(1, 4):
              tail.clear()
              proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1, env=env)
              for line in proc.stdout:
                  sys.stdout.write(line)
                  sys.stdout.flush()
                  tail.append(line.rstrip("\r\n"))
              rc = proc.wait()
              if rc == 0:
                  break
              print(f"Attempt {attempt}/3 exited with {rc}; retrying after backoff...", flush=True)
              time.sleep(attempt * 10)
          if rc != 0:
              escaped = "\n".join(tail).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=APK package/audit failed (exit {rc})::{escaped}", flush=True)
              raise SystemExit(rc)
          PY

      - name: Stage APK release bundle
        id: stage
        env:
          ABI: ${{ matrix.abi }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          import traceback
          import zipfile

          def run_checked(cmd):
              proc = subprocess.run(cmd, capture_output=True, text=True)
              if proc.returncode != 0:
                  raise RuntimeError(
                      f"Command {cmd[0]} exited {proc.returncode}:\nSTDOUT:\n{proc.stdout}\nSTDERR:\n{proc.stderr}"
                  )
              return proc.stdout

          try:
              abi = os.environ["ABI"]
              run_num = int(os.environ.get("RUN_NUMBER", "1"))
              abi_offset = 1 if abi == "arm64-v8a" else 0
              expected_vc = 280000 + run_num * 2 + abi_offset
              min_sdk = 27 if abi in ("armeabi-v7a", "x86") else 28

              gradle_text = Path("packaging/android/build.gradle").read_text(encoding="utf-8")
              version = re.search(r"versionName '([^']+)'", gradle_text).group(1)
              src_apk = Path(".local/android/apk") / abi / "horizon-android-public.apk"
              if not src_apk.is_file():
                  raise RuntimeError(f"Expected built APK at {src_apk}")

              sdk = Path(os.environ["ANDROID_HOME"])
              build_tools = max(
                  (sdk / "build-tools").iterdir(),
                  key=lambda p: tuple(int(v) for v in p.name.split(".")),
              )
              zipalign = build_tools / "zipalign"
              aapt2 = build_tools / "aapt2"
              apksigner_jar = build_tools / "lib/apksigner.jar"
              java = Path(os.environ["JAVA_HOME"]) / "bin/java"
              keystore = Path(".local/android/debug.keystore")

              dist = Path(".local/android/dist") / abi
              dist.mkdir(parents=True, exist_ok=True)
              apk_name = f"Volt-Launcher-{version}-{abi}.apk"
              dst_apk = dist / apk_name

              def entry_order(info):
                  fn = info.filename
                  if fn == "AndroidManifest.xml":
                      return (0, fn)
                  if fn == "resources.arsc":
                      return (1, fn)
                  if fn.startswith("classes") and fn.endswith(".dex"):
                      return (2, fn)
                  if fn.startswith("res/"):
                      return (3, fn)
                  if fn.startswith("assets/"):
                      return (4, fn)
                  if fn.startswith("lib/"):
                      return (5, fn)
                  return (6, fn)

              with tempfile.TemporaryDirectory() as tmp:
                  t = Path(tmp)
                  unsigned_apk = t / "unsigned.apk"
                  aligned_apk = t / "aligned.apk"
                  with zipfile.ZipFile(src_apk, "r") as zin, zipfile.ZipFile(unsigned_apk, "w") as zout:
                      for info in sorted(zin.infolist(), key=entry_order):
                          if info.is_dir():
                              continue
                          upper = info.filename.upper()
                          if upper.startswith("META-INF/") and (
                              upper == "META-INF/MANIFEST.MF"
                              or upper.endswith((".SF", ".RSA", ".DSA", ".EC"))
                              or upper.startswith("META-INF/COM/ANDROID/BUILD/")
                              or upper == "META-INF/VERSION-CONTROL-INFO.TEXTPROTO"
                          ):
                              continue
                          raw = zin.read(info.filename)
                          must_store = (
                              info.filename == "resources.arsc"
                              or (info.filename.startswith("lib/") and info.filename.endswith(".so"))
                          )
                          ctype = zipfile.ZIP_STORED if must_store else info.compress_type
                          ni = zipfile.ZipInfo(filename=info.filename, date_time=(2025, 1, 1, 0, 0, 0))
                          ni.compress_type = ctype
                          ni.external_attr = 0o644 << 16
                          ni.create_system = 3
                          zout.writestr(ni, raw, compress_type=ctype)

                  run_checked([str(zipalign), "-P", "16", "-f", "4", str(unsigned_apk), str(aligned_apk)])
                  run_checked([
                      str(java), "-jar", str(apksigner_jar), "sign",
                      "--ks", str(keystore),
                      "--ks-type", "PKCS12",
                      "--ks-pass", "pass:android",
                      "--ks-key-alias", "androiddebugkey",
                      "--key-pass", "pass:android",
                      "--min-sdk-version", "21",
                      "--v1-signing-enabled", "true",
                      "--v2-signing-enabled", "true",
                      "--v3-signing-enabled", "false",
                      "--v4-signing-enabled", "false",
                      "--out", str(dst_apk),
                      str(aligned_apk),
                  ])

              run_checked([str(zipalign), "-c", "-P", "16", "4", str(dst_apk)])
              run_checked([str(zipalign), "-c", "4", str(dst_apk)])
              sig_out = run_checked([
                  str(java), "-jar", str(apksigner_jar), "verify",
                  "--min-sdk-version", "21",
                  "--max-sdk-version", "35",
                  "--verbose", "--print-certs",
                  str(dst_apk),
              ])
              print(sig_out, flush=True)
              for scheme in (
                  "Verified using v1 scheme (JAR signing): true",
                  "Verified using v2 scheme (APK Signature Scheme v2): true",
                  "Verified using v3 scheme (APK Signature Scheme v3): false",
              ):
                  if scheme not in sig_out:
                      raise RuntimeError(f"Unexpected APK signature scheme state: {scheme}\n{sig_out}")

              run_checked([
                  str(java), "-jar", str(apksigner_jar), "verify",
                  "--min-sdk-version", str(min_sdk),
                  "--max-sdk-version", "35",
                  "--verbose",
                  str(dst_apk),
              ])

              badging = run_checked([str(aapt2), "dump", "badging", str(dst_apk)])
              pkg_line = badging.splitlines()[0] if badging.splitlines() else ""
              vc_match = re.search(r"versionCode='(\d+)'", pkg_line)
              vn_match = re.search(r"versionName='([^']+)'", pkg_line)
              actual_vc = int(vc_match.group(1)) if vc_match else -1
              actual_vn = vn_match.group(1) if vn_match else ""
              if actual_vc != expected_vc:
                  raise RuntimeError(f"APK versionCode mismatch: expected {expected_vc}, got {actual_vc} ({pkg_line})")
              if actual_vn != version:
                  raise RuntimeError(f"APK versionName mismatch: expected {version}, got {actual_vn} ({pkg_line})")

              run_checked([sys.executable, "tools/check_android_release.py", str(dst_apk), "--aapt2", str(aapt2), "--public"])
              with zipfile.ZipFile(dst_apk, "r") as zverify:
                  bad_entry = zverify.testzip()
                  if bad_entry is not None:
                      raise RuntimeError(f"Corrupted ZIP entry in staged APK: {bad_entry}")

              shutil.copy2("LICENSE", dist / "LICENSE.txt")
              shutil.copy2("THIRD_PARTY_NOTICES.md", dist / "THIRD_PARTY_NOTICES.md")

              sha256 = hashlib.sha256(dst_apk.read_bytes()).hexdigest()
              size_bytes = dst_apk.stat().st_size
              size_mib = size_bytes / (1024 * 1024)
              (dist / "SHA256SUMS.txt").write_text(f"{sha256}  {apk_name}\n", encoding="utf-8")

              cert_match = re.search(r"SHA-256 digest:\s*([0-9a-fA-F]+)", sig_out)
              cert_sha = cert_match.group(1).lower() if cert_match else "unknown"
              notice_msg = (
                  f"apk={apk_name} pkg={pkg_line} zipalign16=OK v1=true v2=true v3=false "
                  f"cert_sha256={cert_sha} bytes={size_bytes} sha256={sha256}"
              )
              print(f"\n::notice title=APK Verified::{notice_msg}\n", flush=True)

              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"version={version}\n")
                  out.write(f"apk_name={apk_name}\n")
                  out.write(f"sha256={sha256}\n")
                  out.write(f"size_mib={size_mib:.2f}\n")

              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"### Built `{apk_name}` (`ae.net.Voltlauncher`)\n\n")
                  summary.write(f"- **Package ID:** `ae.net.Voltlauncher`\n")
                  summary.write(f"- **ABI:** `{abi}`\n")
                  summary.write(f"- **Version:** `{version}` (`versionCode={actual_vc}`)\n")
                  summary.write(f"- **Signatures:** `v1 + v2` (`zipalign -P 16 4` verified, 16 KB page-ready)\n")
                  summary.write(f"- **Cert SHA-256:** `{cert_sha}`\n")
                  summary.write(f"- **Size:** `{size_mib:.2f} MiB` (`{size_bytes}` bytes)\n")
                  summary.write(f"- **SHA-256:** `{sha256}`\n")
          except BaseException:
              tb = traceback.format_exc()
              sys.stderr.write(tb)
              escaped = tb.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"\n::error title=Stage APK failed::{escaped}\n", flush=True)
              raise SystemExit(1)
          PY

      - name: Verify live Android upgrade over v0.7.6-build.939d02a (${{ matrix.abi }})
        if: matrix.abi == 'arm64-v8a'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.stage.outputs.apk_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          import time
          import traceback

          def esc(s: str) -> str:
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          sdk = Path(os.environ["ANDROID_HOME"])
          adb = str(sdk / "platform-tools/adb")
          new_apk = Path(".local/android/dist/arm64-v8a") / os.environ["APK_NAME"]
          tmp = Path(tempfile.mkdtemp())
          emu = None
          elog = None
          try:
              old_dir = tmp / "old"
              old_dir.mkdir()
              dl = subprocess.run(
                  ["gh", "release", "download", "v0.7.6-build.939d02a", "-p", "*.apk", "-D", str(old_dir)],
                  capture_output=True, text=True,
              )
              old_apk = next(old_dir.glob("*.apk"), None) if dl.returncode == 0 else None

              sdkmgr = str(sdk / "cmdline-tools/latest/bin/sdkmanager")
              if not Path(sdkmgr).is_file():
                  sdkmgr = shutil.which("sdkmanager") or str(next(sdk.glob("cmdline-tools/*/bin/sdkmanager")))
              avdmgr = str(Path(sdkmgr).with_name("avdmanager"))
              subprocess.run(["sudo", "chmod", "666", "/dev/kvm"], check=False)
              avd_home = tmp / "avd"
              avd_home.mkdir()
              env = dict(os.environ)
              env["ANDROID_SDK_ROOT"] = str(sdk)
              env["ANDROID_AVD_HOME"] = str(avd_home)
              subprocess.run(
                  f"(yes || true) | '{sdkmgr}' 'platform-tools' 'emulator' 'system-images;android-34;google_apis;x86_64' >/dev/null 2>&1",
                  shell=True, check=True, env=env,
              )
              subprocess.run(
                  f"echo no | '{avdmgr}' create avd -f -n verify34 -p '{avd_home / 'verify34.avd'}' -k 'system-images;android-34;google_apis;x86_64' >/dev/null 2>&1",
                  shell=True, check=True, env=env,
              )
              emu_log = tmp / "emu.log"
              elog = open(emu_log, "w")
              emu = subprocess.Popen(
                  [
                      str(sdk / "emulator/emulator"), "-avd", "verify34",
                      "-no-window", "-no-audio", "-no-boot-anim", "-no-snapshot",
                      "-gpu", "swiftshader_indirect", "-memory", "2048",
                  ],
                  stdout=elog, stderr=subprocess.STDOUT, env=env,
              )
              subprocess.run([adb, "start-server"], stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
              for _ in range(90):
                  if emu.poll() is not None:
                      elog.flush()
                      raise RuntimeError(f"Emulator exited ({emu.returncode}):\n{emu_log.read_text()[-2000:]}")
                  if subprocess.run([adb, "shell", "getprop", "sys.boot_completed"], capture_output=True, text=True).stdout.strip() == "1":
                      break
                  time.sleep(2)
              else:
                  elog.flush()
                  raise RuntimeError("Emulator boot timeout")

              for _ in range(30):
                  if subprocess.run([adb, "shell", "pm", "path", "android"], capture_output=True, text=True).stdout.strip().startswith("package:"):
                      break
                  time.sleep(1)

              notes = []
              if old_apk is not None:
                  r_old = subprocess.run([adb, "install", str(old_apk)], capture_output=True, text=True)
                  if r_old.returncode != 0:
                      raise RuntimeError(f"Install of baseline 939d02a failed: {r_old.stdout} {r_old.stderr}")
                  notes.append("baseline_939d02a=Success")

              r_new = subprocess.run([adb, "install", "-r", str(new_apk)], capture_output=True, text=True)
              if r_new.returncode != 0:
                  raise RuntimeError(f"In-place upgrade to {new_apk.name} failed: {r_new.stdout} {r_new.stderr}")
              notes.append(f"upgrade_{new_apk.name}=Success")

              subprocess.run([adb, "logcat", "-c"], check=False)
              launch = subprocess.run(
                  [adb, "shell", "am", "start", "-W", "-n", "ae.net.Voltlauncher/com.google.androidgamesdk.GameActivity"],
                  capture_output=True, text=True,
              )
              time.sleep(2)
              crash_lc = subprocess.run([adb, "logcat", "-d", "-s", "AndroidRuntime:E"], capture_output=True, text=True).stdout
              if "UnsatisfiedLinkError" in crash_lc or "ClassNotFoundException" in crash_lc:
                  raise RuntimeError(f"Runtime crash after upgrade:\n{crash_lc}")
              notes.append(f"launch_rc={launch.returncode}")
              # Keep a visual debugging artifact, separate from release APKs.
              # It is not a pixel-parity or physical-device test.
              time.sleep(10)
              shot = subprocess.run([adb, "exec-out", "screencap", "-p"], capture_output=True)
              if shot.returncode == 0 and shot.stdout.startswith(b"\x89PNG\r\n\x1a\n"):
                  visual = Path(".local/android/launcher-preview")
                  visual.mkdir(parents=True, exist_ok=True)
                  (visual / "launcher.png").write_bytes(shot.stdout)
              print(f"\n::notice title=Live Upgrade Verified::{esc(' | '.join(notes))}\n", flush=True)
          except BaseException:
              tb = traceback.format_exc()
              print(f"\n::error title=Live Upgrade Check Failed::{esc(tb[:2500])}\n", flush=True)
              raise SystemExit(1)
          finally:
              if emu is not None:
                  emu.kill()
                  emu.wait(timeout=10)
              if elog is not None:
                  elog.close()
              subprocess.run([adb, "kill-server"], stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
          PY

      - name: Upload launcher preview for visual review
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-emulator-preview
          path: .local/android/launcher-preview/launcher.png
          if-no-files-found: warn

      - name: Upload APK artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: Volt-Launcher-${{ steps.stage.outputs.version }}-${{ matrix.abi }}
          path: .local/android/dist/${{ matrix.abi }}/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: needs.plan.outputs.publish_release == 'true'
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download built APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Volt-Launcher-*
          path: .local/android/release-collect
          merge-multiple: true

      - name: Assemble release attachments and checksums
        id: bundle
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import zipfile

          collect = Path(".local/android/release-collect")
          apks = sorted(collect.glob("Volt-Launcher-*.apk"))
          if not apks:
              raise SystemExit("No APKs found to publish")

          for p in apks:
              if p.stat().st_size < 10 * 1024 * 1024:
                  raise SystemExit(f"APK {p.name} unexpectedly small ({p.stat().st_size} bytes)")
              with zipfile.ZipFile(p, "r") as zf:
                  bad = zf.testzip()
                  if bad is not None:
                      raise SystemExit(f"APK {p.name} failed CRC check at {bad}")

          gradle_text = Path("packaging/android/build.gradle").read_text(encoding="utf-8")
          version = re.search(r"versionName '([^']+)'", gradle_text).group(1)
          sums = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in apks)
          (collect / "SHA256SUMS.txt").write_text(sums, encoding="utf-8")

          is_tag = os.environ["IS_TAG"].lower() == "true"
          tag = os.environ["REF_NAME"] if is_tag else f"v{version}-build.{os.environ['SHA_SHORT'][:7]}"
          title = f"Volt Launcher {tag}" if is_tag else f"Volt Launcher {version} ({os.environ['SHA_SHORT'][:7]})"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"title={title}\n")
              out.write(f"prerelease={'false' if is_tag else 'true'}\n")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bundle.outputs.tag }}
          TITLE: ${{ steps.bundle.outputs.title }}
          PRERELEASE: ${{ steps.bundle.outputs.prerelease }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<'EOF'
          ### Development build

          This APK includes selected native Volt features inspired by third-party mods.
          The catalog does **not** implement all original mods, their complete settings
          screens, or all keybindings. Most entries still use placeholder icons.
          Original icons are included for AppleSkin, Armor HUD, Low Fire, Mod Menu,
          ShulkerBoxTooltip, Language Reload, FastQuit, BetterF3, Better Ping Display,
          Controlling, Mouse Tweaks, No Fog, FerriteCore, Dynamic FPS, BadOptimizations,
          Screenshot to Clipboard, Chat Heads, and Better Clouds; see THIRD_PARTY_NOTICES.md.
          EOF
          sed -i 's/^          //' "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              .local/android/release-collect/Volt-Launcher-*.apk \
              .local/android/release-collect/SHA256SUMS.txt \
              .local/android/release-collect/LICENSE.txt \
              .local/android/release-collect/THIRD_PARTY_NOTICES.md \
              --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            EXTRA_FLAGS=()
            if [ "$PRERELEASE" = "true" ]; then
              EXTRA_FLAGS+=(--prerelease --target "$GITHUB_SHA")
            fi
            gh release create "$TAG" \
              .local/android/release-collect/Volt-Launcher-*.apk \
              .local/android/release-collect/SHA256SUMS.txt \
              .local/android/release-collect/LICENSE.txt \
              .local/android/release-collect/THIRD_PARTY_NOTICES.md \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              "${EXTRA_FLAGS[@]}"
          fi
