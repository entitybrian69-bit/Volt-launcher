name: Volt Windows engine
on:
  push:
    branches: ['arena/**', pc-windows]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volt-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      HORIZON_NO_AUDIO: '1'
      HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
      HORIZON_TELEMETRY_URL: 'off'
      CARGO_PROFILE_FAST_INCREMENTAL: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Isolate player data
        shell: pwsh
        run: |
          foreach ($key in 'HORIZON_HOME','HORIZON_LAUNCHER_HOME','XDG_DATA_HOME','XDG_CONFIG_HOME','HORIZON_LAUNCHER_TRASH','HORIZON_LAUNCHER_CLIPBOARD','HORIZON_LAUNCHER_DESKTOP') {
            "$key=$env:RUNNER_TEMP\volt test\$key" >> $env:GITHUB_ENV
          }
      - name: Encode and decode a replay with Windows Media Foundation
        run: cargo test --locked -p volt-windows-media --target x86_64-pc-windows-msvc
      - name: Read live memory counters for Volt Boost and the HUD
        run: cargo test --locked -p horizon-threads --target x86_64-pc-windows-msvc --lib windows_memory_counters
      - name: Build native game with audio, controllers and sandboxed mods
        shell: pwsh
        run: |
          cargo build --message-format=short --profile fast --locked --target x86_64-pc-windows-msvc -p horizon-client --bin horizon-client --features mods 2>&1 | ForEach-Object {
            Write-Host $_
            if ("$_" -match '\berror(\[E\d+\])?:') { Write-Host "::error::$_" }
          }
          exit $LASTEXITCODE
      - name: Check DLL imports and start the real game CLI
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/fast/horizon-client.exe'
          python tools/check_imports.py --windows-x64 $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $help = & $exe --help
          if ($LASTEXITCODE -ne 0 -or -not ($help -join "`n").Contains('--resources')) { throw 'Game CLI did not start' }
      - name: Release tooling rejects the engine-only build
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem packaging/windows/*.ps1) {
            $parseErrors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors -join "`n") }
          }
          $out = Join-Path $env:RUNNER_TEMP 'must-not-be-created'
          try {
            ./packaging/windows/build-candidate.ps1 -Payload target/x86_64-pc-windows-msvc/fast -OutputDirectory $out -Version 0.0.1
            throw 'Engine was accepted as the Volt Launcher'
          } catch {
            if ($_.Exception.Message -ne 'Missing public payload file: Volt Launcher.exe') { throw }
          }
          if (Test-Path -LiteralPath $out) { throw 'Packaging wrote output before validation' }
      - uses: actions/upload-artifact@v4
        with:
          name: volt-windows-engine-only
          path: |
            target/x86_64-pc-windows-msvc/fast/horizon-client.exe
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
