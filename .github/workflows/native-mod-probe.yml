# Re-run after engine-side target fixes (e.g. horizon-android render dep) by pushing a (probe rerun: Jukebox::record accessor)
# change to this file; the probe only triggers on worker or workflow edits.
name: Native mod compatibility probe

# Probe pass: special_block_model restored, horizonmatica slider shim.
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - .github/workflows/native-mod-probe.yml
      - tools/native_mods/**

# No signing secrets, release permissions, caches, or deployment. Run only on
# disposable GitHub-hosted runners; native mods and Cargo build scripts are code.
permissions:
  contents: read

jobs:
  # Each candidate registry mod builds alone against Volt's engine revision,
  # with the mixin compiler revision its published bundle pins. The bundle is
  # fetched from the registry's release assets and checked against the pinned
  # registry snapshot (SHA-256 and revocations) before anything is extracted.
  registry-mod:
    name: ${{ matrix.mod }} / ${{ matrix.abi }} (unsigned library only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
        mod: [jei, jade, veinminer, horizon_physics, appleskin, status_effect_hud,
              toggle_sprint, inventory_profiles, shulker_peek, mousetricks, itemnew,
              voicechat, worldedit, horizonmatica, visuality_horizon, eatinganimation,
              enchantmenthints, held_item_info, right_click_crops,
              carryblock, chatheads, smartf3, fast_items, armor_status, customhud,
              coords_hud, crosshair_indicator, hitbox_plus, biomecompass,
              invisible_frames, freelook, skins_3d]
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - mod: jei
            file: jei-0.1.0.hnmod
            tag: jei-0.1.0
          - mod: jade
            file: jade-26.3.5.hnmod
            tag: jade-26.3.5
            raw_targets: "--experimental-raw-targets"
          - mod: veinminer
            file: veinminer-0.3.2.hnmod
            tag: veinminer-0.3.2
            raw_targets: "--experimental-raw-targets"
          - mod: horizon_physics
            file: horizon_physics-0.15.1.hnmod
            tag: horizon_physics-0.15.1
            raw_targets: "--experimental-raw-targets"
          - mod: appleskin
            file: appleskin-1.0.0.hnmod
            tag: appleskin-1.0.0
            raw_targets: "--experimental-raw-targets"
          - mod: status_effect_hud
            file: status_effect_hud-1.0.0.hnmod
            tag: status_effect_hud-1.0.0
            raw_targets: "--experimental-raw-targets"
          - mod: toggle_sprint
            file: toggle_sprint-1.0.0.hnmod
            tag: toggle_sprint-1.0.0
            raw_targets: "--experimental-raw-targets"
          - mod: inventory_profiles
            file: inventory_profiles-1.0.0.hnmod
            tag: inventory_profiles-1.0.0
            raw_targets: "--experimental-raw-targets"
          - mod: shulker_peek
            file: shulker_peek-0.1.0.hnmod
            tag: shulker_peek-0.1.0
            raw_targets: "--experimental-raw-targets"
          - mod: mousetricks
            file: mousetricks-0.2.0.hnmod
            tag: mousetricks-0.2.0
            raw_targets: "--experimental-raw-targets"
          - mod: itemnew
            file: itemnew-0.1.1.hnmod
            tag: itemnew-0.1.1
            raw_targets: "--experimental-raw-targets"
          - mod: voicechat
            file: voicechat-1.0.0.hnmod
            tag: voicechat-1.0.0
            raw_targets: "--experimental-raw-targets"
          - mod: worldedit
            file: worldedit-1.2.1.hnmod
            tag: worldedit-1.2.1
            raw_targets: "--experimental-raw-targets"
          - mod: horizonmatica
            file: horizonmatica-0.1.1.hnmod
            tag: horizonmatica-0.1.1
            raw_targets: "--experimental-raw-targets"
          - mod: visuality_horizon
            file: visuality_horizon-1.0.2.hnmod
            tag: visuality_horizon-1.0.2
            raw_targets: "--experimental-raw-targets"
          - mod: eatinganimation
            file: eatinganimation-0.1.0.hnmod
            tag: eatinganimation-0.1.0
            raw_targets: "--experimental-raw-targets"
          - mod: enchantmenthints
            file: enchantmenthints-0.1.0.hnmod
            tag: enchantmenthints-0.1.0
            raw_targets: "--experimental-raw-targets"
          - mod: held_item_info
            file: held_item_info-0.1.0.hnmod
            tag: held_item_info-0.1.0
            raw_targets: "--experimental-raw-targets"
          - mod: right_click_crops
            file: right_click_crops-1.0.0.hnmod
            tag: right_click_crops-1.0.0
            raw_targets: "--experimental-raw-targets"
          - mod: carryblock
            file: carryblock-0.1.2.hnmod
            tag: carryblock-0.1.2
            raw_targets: "--experimental-raw-targets"
          - mod: chatheads
            file: chatheads-0.1.0.hnmod
            tag: chatheads-0.1.0
            raw_targets: "--experimental-raw-targets"
          - mod: smartf3
            file: smartf3-0.1.0.hnmod
            tag: smartf3-0.1.0
            raw_targets: "--experimental-raw-targets"
          - mod: fast_items
            file: fast_items-0.1.0.hnmod
            tag: fast_items-0.1.0
            raw_targets: "--experimental-raw-targets"
          - mod: armor_status
            file: armor_status-1.0.0.hnmod
            tag: armor_status-1.0.0
            raw_targets: "--experimental-raw-targets"
          - mod: customhud
            file: customhud-1.6.0.hnmod
            tag: customhud-1.6.0
            raw_targets: "--experimental-raw-targets"
          - mod: coords_hud
            file: coords_hud-2.0.0.hnmod
            tag: coords_hud-2.0.0
            raw_targets: "--experimental-raw-targets"
          - mod: crosshair_indicator
            file: crosshair_indicator-1.0.0.hnmod
            tag: crosshair_indicator-1.0.0
            raw_targets: "--experimental-raw-targets"
          - mod: hitbox_plus
            file: hitbox_plus-1.3.0.hnmod
            tag: hitbox_plus-1.3.0
            raw_targets: "--experimental-raw-targets"
          - mod: biomecompass
            file: biomecompass-0.2.2.hnmod
            tag: biomecompass-0.2.2
            raw_targets: "--experimental-raw-targets"
          - mod: invisible_frames
            file: invisible_frames-0.1.1.hnmod
            tag: invisible_frames-0.1.1
            raw_targets: "--experimental-raw-targets"
          - mod: freelook
            file: freelook-0.3.1.hnmod
            tag: freelook-0.3.1
            raw_targets: "--experimental-raw-targets"
          - mod: skins_3d
            file: skins_3d-1.1.0.hnmod
            tag: skins_3d-1.1.0
            raw_targets: "--experimental-raw-targets"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install signature verification dependency
        run: python3 -m pip install cryptography
      - name: Test worker
        run: python3 -m unittest discover -s tools/native_mods -v
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Fetch pinned registry snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/registry"
          curl --retry 3 -fsSL https://codeload.github.com/horizon-rust/horizon-mods/tar.gz/63daa89bcbdcb80282c29970d743d6d00918a6ce | tar -xz -C "$RUNNER_TEMP/registry" --strip-components=1
      - name: Download published bundle and verify against the registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          curl --retry 3 -fsSL -o "$RUNNER_TEMP/bundle/${{ matrix.file }}" \
            "https://github.com/horizon-rust/horizon-mods/releases/download/${{ matrix.tag }}/${{ matrix.file }}"
          python3 - <<'PYCODE'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/native_mods')
          import compat
          temp = Path(os.environ['RUNNER_TEMP'])
          mod_id = os.environ['PROBE_MOD']
          registry = temp / 'registry'
          entry = compat.read_entry(registry, mod_id)
          data = compat.verified_extract(
              temp / 'bundle' / os.environ['PROBE_FILE'], entry,
              temp / 'extract-check' / mod_id, registry)
          mixins = data['meta']['mixins']
          if not compat.REV.fullmatch(mixins):
              raise SystemExit(f'{mod_id}: bundle pins an invalid mixins revision')
          print(f'{mod_id}: verified, pins mixins {mixins}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PROBE_MIXINS={mixins}\n')
          PYCODE
        env:
          PROBE_MOD: ${{ matrix.mod }}
          PROBE_FILE: ${{ matrix.file }}
      - name: Install the bundle's pinned mixin compiler
        run: |
          cargo install --locked --git https://github.com/horizon-rust/horizon-mixins \
            --rev "$PROBE_MIXINS" \
            --root "$RUNNER_TEMP/mixins-tool" horizon-mixins-cli
      - name: Build reviewed source on disposable runner
        run: |
          python3 tools/native_mods/build_set.py \
            --registry "$RUNNER_TEMP/registry" \
            --mod "${{ matrix.mod }}=$RUNNER_TEMP/bundle/${{ matrix.file }}" \
            --mixins "$RUNNER_TEMP/mixins-tool/bin/horizon-mixins" \
            --mixins-revision "$PROBE_MIXINS" \
            --abi "${{ matrix.abi }}" --output "$RUNNER_TEMP/worker-result" --trust-native-code \
            ${{ matrix.raw_targets }}
      - name: Show failure diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'worker-result'
          def emit(title, body):
              safe = body[:3500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={title}::' + safe)
          text = '\n'.join(f'{name}:\n' + (root / name).read_text(errors='replace')[-2800:]
                           for name in ('report.json', 'apply.log', 'build.log') if (root / name).is_file())
          if text:
              emit('Native worker failed', text[-3500:])
          # Every compiler error with context, chunked into further annotations.
          build = root / 'build.log'
          if build.is_file():
              lines = build.read_text(errors='replace').splitlines()
              blocks, keep = [], 0
              for i, line in enumerate(lines):
                  if line.startswith('error'):
                      keep = 13
                  if keep:
                      blocks.append(line)
                      keep -= 1
              errors = '\n'.join(blocks)
              for n in range(0, min(len(errors), 8 * 3400), 3400):
                  emit(f'Compiler errors {n // 3400 + 1}', errors[n:n + 3400])
          PYCODE
      - name: Upload worker report and unsigned library (not an APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-worker-${{ matrix.mod }}-${{ matrix.abi }}
          path: ${{ runner.temp }}/worker-result/
          if-no-files-found: warn
          retention-days: 14
