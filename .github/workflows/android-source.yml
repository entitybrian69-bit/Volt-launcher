# The source exporter installs this as the fork's only active workflow.
name: Android source checks
on:
  push:
    branches: [android]
  pull_request:
    branches: [android]
  workflow_dispatch:
    inputs:
      native_checks:
        description: Type-check all four Android ABIs (slower)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git diff --check
      - run: python3 tools/check_public_tree.py --history
      - run: python3 -m unittest discover -s tests -p 'test_android*.py'
      - run: python3 tools/test_android_diagnostics.py
      - run: python3 tools/test_android_performance.py
      - run: python3 tools/test_android_content.py
      - name: Check workflow export matches the active workflow
        run: cmp .github/workflows/android-source.yml packaging/android/source-checks.yml
  apk:
    # Produce an installable arm64 APK for each Android-branch update.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HORIZON_TELEMETRY_URL: "off"
      CARGO_TARGET_DIR: .local/ci-target
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android NDK and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "ndk;28.2.13676358" "build-tools;35.0.0"
      - name: Install Gradle 8.14
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
      - name: Prepare pinned Minecraft engine resources
        run: python3 tools/android_prepare.py
      - name: Install target for the repository-pinned Rust toolchain
        run: rustup target add aarch64-linux-android
      - name: Build and audit public arm64 APK
        run: python3 tools/android_build.py --abi arm64-v8a --public --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --gradle /opt/gradle-8.14/bin/gradle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: volt-launcher-android-arm64
          path: .local/android/apk/arm64-v8a/horizon-android-public.apk
          if-no-files-found: error
          retention-days: 30
  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native_checks
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86
            target: i686-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    env:
      HORIZON_TELEMETRY_URL: "off"
      CARGO_TARGET_DIR: .local/ci-target
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Android toolchain
        run: |
          sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0"
          rustup target add "${{ matrix.target }}"
      - name: Check Android Rust code without building an APK
        run: python3 tools/android_build.py --abi "${{ matrix.abi }}" --check --public --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64"
