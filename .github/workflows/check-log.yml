name: Check log
on:
  push:
    branches: [android]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Cargo check
        run: |
          cargo check -p horizon-android 2>&1 | tee /tmp/check.log || true
          cat /tmp/check.log
          # create issue with log
          gh issue create --title "cargo check log $(date -u +%T)" --body "$(head -c 65000 /tmp/check.log)" || true
        env:
          GH_TOKEN: ${{ github.token }}
