name: Check log
on:
  workflow_dispatch:
  push:
    branches: [android]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Cargo check
        run: cargo check -p horizon-android --message-format=human 2>&1 | tee /tmp/check.log || true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view check-log >/dev/null 2>&1 || gh release create check-log --title "check log" --notes "check" --latest=false
          gh release upload check-log /tmp/check.log --clobber
