name: Check log
on:
  push:
    branches: [android]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Cargo check
        run: |
          cargo check -p horizon-android 2>&1 | tee /tmp/check.log || true
          cat /tmp/check.log
          mkdir -p /tmp/out
          cp /tmp/check.log /tmp/out/check.log
          echo "=== cargo check done ==="
      - uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: /tmp/out/check.log
      - name: Commit log to branch
        run: |
          git config user.name "volt-bot"
          git config user.email "volt@bot.local"
          git checkout -B check-log-branch
          mkdir -p /tmp/commit
          cp /tmp/check.log check.log
          git add check.log
          git commit -m "check log $(date -u +%T)" || true
          git push origin check-log-branch --force
