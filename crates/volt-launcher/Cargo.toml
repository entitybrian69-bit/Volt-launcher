[package]
name = "volt-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "volt-launcher"
path = "src/main.rs"
test = false

[target.'cfg(windows)'.dependencies]
horizon-client = { path = "../horizon-client" }
glam = "0.30"
base64 = "0.22"
horizon-world = { path = "../horizon-world" }
horizon-core = { path = "../horizon-core" }
horizon-theme = { path = "../horizon-theme" }
horizon-port-pack = { path = "../horizon-port-pack" }
winit = "0.30.13"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
keyring = { version = "3.6.3", features = ["windows-native"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
arboard = { version = "3.6.1", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
